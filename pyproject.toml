[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-creator-local-client"
version = "1.0.0"
description = "Local and LAN client for Gemini Creator Core desktop jobs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gemini-local = "gemini_local_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemini_local_client*"]
